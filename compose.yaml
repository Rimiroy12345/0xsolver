services:
  app:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      LM_BASE_URL: http://host.docker.internal:1234/v1
      WORKER_URL: http://worker:8001
      DATA_ROOT: /data
    volumes: ["cases:/data"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [default, analysis]
    depends_on: [worker]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    pids_limit: 128
  worker:
    build: .
    command: ["uvicorn", "app.worker:app", "--host", "0.0.0.0", "--port", "8001"]
    environment: {DATA_ROOT: /data}
    volumes: ["cases:/data"]
    networks: [analysis]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
networks:
  analysis:
    internal: true
volumes:
  cases:
